name: Build Android APK

# Builds a release APK in the cloud, so nobody needs a local Android SDK or
# JDK. GitHub-hosted runners are free for public repos and come with generous
# free minutes for private ones.
#
# Download the result from the run's "Artifacts" section.

on:
  push:
    branches: [flutterflow, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Baseline is 2 known FlutterFlow warnings in serialization_util.dart.
      # Fail the build on anything that is an actual error.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # Release signing: if the repo has a keystore in secrets, use it.
      # Otherwise the build falls back to debug signing (see app/build.gradle),
      # which still produces an installable APK for demos.
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build App Bundle
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hertwin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: hertwin-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Never let the keystore linger on the runner.
      - name: Clean up signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
